<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>늘봄 — 방에 맞는 식물을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--ink:#2e2b27;--sub:#8a847a;--line:#e8e3da;--leaf:#5f7a62;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;letter-spacing:.02em;line-height:1.75}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(251,250,247,.94);backdrop-filter:blur(6px);z-index:20}
.logo{font-family:'Nanum Myeongjo',serif;font-size:24px;font-weight:700;letter-spacing:.18em;line-height:1.2}
.logo small{display:block;font-size:9px;letter-spacing:.4em;color:var(--sub);font-weight:400}
.cartbtn{font-size:13px;color:var(--ink);border:1px solid var(--line);padding:6px 14px;border-radius:30px;background:#fff}
.cartbtn b{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--leaf);color:#fff;font-size:11px;margin-left:6px;font-weight:400}
main{max-width:1080px;margin:0 auto;padding:26px 20px 90px;animation:f .5s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hero{text-align:center;padding:22px 0 34px}
.hero h1{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:32px;line-height:1.5}
.hero p{color:var(--sub);font-size:14px;margin-top:12px}
.ttl{text-align:center;margin:6px 0 24px}
.ttl .city{font-size:11px;letter-spacing:.4em;color:var(--sub)}
.ttl h2{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:25px}
.ttl p{color:var(--sub);font-size:13px;margin-top:4px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.room{display:block;background:var(--card);border-radius:4px;overflow:hidden;transition:.3s}
.room:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.06)}
.room img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.room .cap{padding:14px 18px 18px}
.room .city{font-size:11px;letter-spacing:.35em;color:var(--sub)}
.room h3{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:20px}
.room p{font-size:13px;color:var(--sub)}
/* 部屋の絵＋植物の点 */
.scene{position:relative;border-radius:4px;overflow:hidden;background:#eee}
.scene img{width:100%;display:block}
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hs::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--leaf)}
.hs::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:p 2s infinite}
@keyframes p{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hs.on::after{background:var(--ink)}
.tip{position:absolute;z-index:5;background:#fff;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:12px;padding:10px;width:270px;align-items:center}
.tip img{width:70px;height:70px;object-fit:cover;border-radius:4px}
.tip b{font-weight:400;font-size:15px;display:block}
.tip span{font-size:12px;color:var(--sub)}
.tip .go{display:inline-block;margin-top:4px;font-size:12px;border-bottom:1px solid var(--ink)}
.hint{text-align:center;color:var(--sub);font-size:12px;margin:12px 0 26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.item{display:block;cursor:pointer;background:var(--card);border:1px solid transparent;border-radius:4px;overflow:hidden;transition:.25s;text-align:center}
.item:hover,.item.sel{border-color:var(--ink)}
.item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.item h4{font-weight:400;font-size:16px;padding:12px 6px 0}
.item p{font-size:12px;color:var(--sub);padding:0 10px 14px}
.tag{display:inline-block;font-size:10px;letter-spacing:.15em;color:var(--leaf);border:1px solid var(--leaf);border-radius:10px;padding:0 8px;margin-top:6px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.detail img{width:100%;border-radius:4px;display:block}
.detail h2{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:28px}
.detail .price{font-size:18px;margin:6px 0 14px}
.detail dl{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:18px}
.detail dl div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--sub);margin-bottom:18px}.crumb a{text-decoration:underline}
.opt{max-width:620px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .l b{font-weight:400;font-size:15px}.row .l p{font-size:12px;color:var(--sub)}
.row .r{font-size:13px;color:var(--sub);white-space:nowrap}
.dot{display:inline-block;width:16px;height:16px;border:1px solid var(--ink);border-radius:50%;margin-left:12px;vertical-align:middle}
.row.sel .dot{background:var(--leaf);border-color:var(--leaf)}
.sum{margin:28px auto 0;max-width:620px;background:var(--card);padding:22px;border-radius:4px}
.sum .line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--sub)}
.sum .tot{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;color:var(--ink);font-size:18px}
.note{font-size:12px;color:var(--sub);margin-top:14px;text-align:center}
.btn{display:block;margin:24px auto 0;padding:14px 46px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-family:inherit;font-size:15px;letter-spacing:.2em;border-radius:40px;cursor:pointer;text-align:center}
.btn.ghost{background:#fff;color:var(--ink)}
.back{display:block;margin:20px auto 0;background:none;border:none;color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-align:center}
.cartrow{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.cartrow img{width:76px;height:76px;object-fit:cover;border-radius:4px}
.cartrow .m{flex:1;font-size:13px;color:var(--sub)}.cartrow .m b{display:block;color:var(--ink);font-weight:400;font-size:15px}
.cartrow .x{background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
form.f{max-width:520px;margin:0 auto}
.f label{display:block;font-size:12px;color:var(--sub);margin-top:14px}
.f input,.f textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:15px;background:#fff;margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:50px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;font-size:11px;color:var(--sub);padding:28px;border-top:1px solid var(--line);letter-spacing:.2em}
@media(max-width:700px){.rooms{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.detail{grid-template-columns:1fr;gap:18px}.tip{width:230px}main{padding:18px 14px 80px}}
/* ── v2 スライド・横スクロール ── */
html,body{overflow-x:clip}
.bleed{width:100vw;margin-left:calc(50% - 50vw)}
.slider{position:relative;height:min(82vh,760px);overflow:hidden;background:#222;margin-top:-26px;touch-action:pan-y;user-select:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 7s ease-out;-webkit-user-drag:none}
.slide.on img{transform:scale(1)}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(20,18,15,.62));pointer-events:none}
.sl-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;padding:0 max(24px,calc(50vw - 520px)) 70px}
.sl-cap .city{font-size:11px;letter-spacing:.5em;opacity:.85}
.sl-cap h2{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:clamp(30px,5vw,54px);line-height:1.3;margin:6px 0 8px}
.sl-cap p{font-size:14px;opacity:.85;max-width:460px}
.sl-cap a{display:inline-block;margin-top:20px;padding:11px 30px;border:1px solid rgba(255,255,255,.8);border-radius:40px;font-size:13px;letter-spacing:.2em;transition:.3s}
.sl-cap a:hover{background:#fff;color:var(--ink)}
.sl-cap .slno{position:absolute;right:max(24px,calc(50vw - 520px));bottom:74px;font-size:12px;letter-spacing:.3em;opacity:.85}
.sl-nav{position:absolute;top:50%;z-index:3;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.12);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(4px);transition:.3s}
.sl-nav:hover{background:rgba(255,255,255,.25)}
.sl-nav.p{left:22px}.sl-nav.n{right:22px}
.sl-bar{position:absolute;left:max(24px,calc(50vw - 520px));right:max(24px,calc(50vw - 520px));bottom:34px;z-index:3;display:flex;gap:8px}
.sl-bar i{flex:1;height:2px;background:rgba(255,255,255,.3);cursor:pointer;position:relative;overflow:hidden}
.sl-bar i::before{content:'';position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.sl-bar i b{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.sl-bar i.done b{transform:scaleX(1)}
.sl-bar i.on b{animation:bar var(--dur) linear forwards}
@keyframes bar{to{transform:scaleX(1)}}
.intro{text-align:center;padding:76px 0 56px}
.intro h1{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:30px;line-height:1.6}
.intro p{color:var(--sub);font-size:14px;margin-top:14px}
.intro hr{width:1px;height:46px;border:none;background:var(--line);margin:0 auto 30px}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 18px}
.sec h3{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:22px}
.sec .en{font-size:10px;letter-spacing:.45em;color:var(--sub);display:block}
.arw{display:flex;gap:8px}
.arw button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:14px;transition:.25s}
.arw button:hover{border-color:var(--ink)}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:14px;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.track>*{scroll-snap-align:start;flex:none}
.rcard{width:300px;position:relative;display:block}
.rcard .ph{aspect-ratio:3/4;overflow:hidden;border-radius:3px;background:#eee}
.rcard img,.pcard img{width:100%;height:100%;object-fit:cover;transition:transform .9s ease;pointer-events:none}
.rcard:hover img{transform:scale(1.05)}
.rcard .no{font-size:11px;letter-spacing:.3em;color:var(--sub);margin-top:14px}
.rcard h4{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:19px;margin-top:2px}
.rcard p{font-size:12px;color:var(--sub)}
.pcard{width:210px;display:block}
.pcard .ph{aspect-ratio:1;overflow:hidden;border-radius:3px;background:#eee}
.pcard:hover img{transform:scale(1.06)}
.pcard h4{font-weight:400;font-size:15px;margin-top:10px}
.pcard p{font-size:12px;color:var(--sub)}
.gap{height:64px}
@media(max-width:700px){.slider{height:72vh;margin-top:-18px}.sl-nav{display:none}.sl-cap{padding-bottom:60px}.sl-cap .slno{bottom:64px}.rcard{width:72vw}.pcard{width:42vw}.intro{padding:56px 0 40px}.intro h1{font-size:23px}}
/* ── v3 NOT A HOTEL風 ── */
header{transition:background .4s,border-color .4s,color .4s}
body.over header{background:transparent;border-color:transparent;backdrop-filter:none;color:#fff}
body.over header .logo small{color:rgba(255,255,255,.75)}
body.over header .cartbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff;backdrop-filter:blur(6px)}
.slider{height:100vh;height:100svh;max-height:none}
.slide::after{background:linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(20,18,15,.6))}
.sl-cap{text-align:center;padding:0 24px 9vh}
.sl-cap .city{font-size:12px;letter-spacing:.55em}
.sl-cap h2{font-size:clamp(40px,8vw,96px);line-height:1.15;margin:10px 0 10px;letter-spacing:.04em}
.sl-cap p{margin:0 auto}
.sl-cap .btns{display:flex;gap:12px;justify-content:center;margin-top:26px}
.sl-cap .btns a{margin:0;padding:13px 30px;border-radius:40px;font-size:13px;letter-spacing:.15em;border:none}
.sl-cap .btns .a1{background:rgba(46,43,39,.72);color:#fff;backdrop-filter:blur(6px)}
.sl-cap .btns .a2{background:var(--leaf);color:#fff}
.sl-cap .btns a:hover{filter:brightness(1.12);background-blend-mode:normal}
.sl-cap .slno{display:none}
.sl-bar{display:none}
.thumbs{position:absolute;top:96px;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:16px}
.thumbs button{position:relative;width:62px;height:62px;border-radius:50%;border:none;padding:0;background:none;cursor:pointer}
.thumbs img{position:absolute;inset:5px;width:52px;height:52px;border-radius:50%;object-fit:cover;opacity:.7;transition:.3s}
.thumbs button.on img,.thumbs button:hover img{opacity:1}
.thumbs svg{position:absolute;inset:0;transform:rotate(-90deg)}
.thumbs circle{fill:none;stroke-width:2}
.thumbs .bg{stroke:rgba(255,255,255,.35)}
.thumbs .fg{stroke:#fff;stroke-dasharray:183;stroke-dashoffset:183}
.thumbs button.on .fg{animation:ring var(--dur) linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.sec2{text-align:center;margin:90px 0 40px}
.sec2 .en{font-size:11px;letter-spacing:.5em;color:var(--sub)}
.sec2 h3{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:26px;margin-top:6px}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 22px}
.lcard{display:block}
.lcard .ph{position:relative;aspect-ratio:5/6;border-radius:6px;overflow:hidden;background:#ddd}
.lcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s ease}
.lcard:hover .ph img{transform:scale(1.05)}
.lcard .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 45%)}
.lcard .big{position:absolute;top:18px;left:0;right:0;z-index:2;text-align:center;color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:clamp(26px,3.2vw,40px);letter-spacing:.12em;line-height:1.1}
.lcard .new{position:absolute;left:12px;bottom:12px;z-index:2;background:#fff;color:var(--ink);font-size:11px;letter-spacing:.15em;padding:3px 9px;border-radius:2px}
.lcard .area{font-size:12px;letter-spacing:.3em;color:var(--sub);margin-top:14px}
.lcard h4{font-weight:400;font-size:15px;margin-top:2px}
.lcard .pr{font-size:14px;margin-top:10px}
.dark{background:#1f1d1a;color:#f3efe7;padding:90px max(20px,calc(50vw - 540px)) 100px;margin-top:100px}
.dark .sec2{margin:0 0 44px}.dark .sec2 h3{color:#fff}.dark .sec2 .en{color:#a59f94}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{border:1px solid #34312c;border-radius:8px;padding:22px 20px 30px;background:#24221e;text-align:center}
.step .n{text-align:left;font-size:18px;letter-spacing:.1em;color:#fff}
.step .ic{width:118px;height:118px;border-radius:50%;object-fit:cover;margin:18px auto 22px;display:block;border:1px solid #4a463f}
.step b{display:block;font-weight:700;font-size:16px;color:#fff}
.step p{font-size:13px;color:#b8b2a7;margin-top:10px;line-height:1.8}
.band{position:relative;height:440px;overflow:hidden;margin-top:0}
.band img{width:100%;height:100%;object-fit:cover}
.band::after{content:'';position:absolute;inset:0;background:rgba(20,18,15,.45)}
.band div{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.band h3{font-family:'Nanum Myeongjo',serif;font-weight:400;font-size:clamp(24px,3.4vw,36px);line-height:1.5}
.band a{margin-top:26px;padding:14px 40px;border-radius:40px;background:var(--leaf);color:#fff;font-size:14px;letter-spacing:.2em}
body.home main{padding-bottom:0}
body.home footer{border-top:none}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
 .thumbs{top:84px;gap:10px}.thumbs button{width:50px;height:50px}.thumbs img{width:42px;height:42px}
 .sl-cap{padding-bottom:8vh}.sl-cap .btns a{padding:12px 22px}
 .lineup{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;scrollbar-width:none;margin:0 -14px;padding:0 14px}
 .lineup::-webkit-scrollbar{display:none}
 .lcard{flex:none;width:76vw;scroll-snap-align:center}
 .steps{grid-template-columns:1fr}.step{display:grid;grid-template-columns:84px 1fr;text-align:left;gap:0 16px;align-items:center;padding:18px}
 .step .n{grid-column:1/3;margin-bottom:6px}.step .ic{width:84px;height:84px;margin:0;grid-row:2/4}.step p{margin-top:4px}
 .dark{padding:64px 16px 70px;margin-top:70px}.band{height:360px}.sec2{margin:64px 0 28px}}
.ofc{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:6px}
@media(max-width:700px){.sl-bar{bottom:62px}.sl-cap{padding-bottom:96px}}
.ofc button{font:600 12px/1 system-ui,sans-serif;padding:9px 12px;border-radius:20px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.92);color:#222;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer}
</style>
</head>
<body>
<header><a href="#/" class="logo">늘봄<small>NEULBOM · PLANT LIFE</small></a><a href="#/cart" class="cartbtn">장바구니<b id="cnt">0</b></a></header>
<main id="app"></main>
<footer>늘봄 · 방에 맞는 식물을 · 시안(데모) 사이트</footer>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const w=n=>'₩'+n.toLocaleString();
const SOIL=[['기본 배합토',0,'식물에 맞춰 섞어 드려요'],['배수 좋은 흙',4000,'다육과 분재에 추천']];
const EXTRA=[['영양제',6000,'첫 석 달을 위한 한 병'],['손글씨 카드',3000,'선물이라면 한 줄의 마음을']];
const plantById=id=>{for(const r of ROOMS)for(const p of r.plants)if(p.id==id)return [p,r]};
const potById=id=>POTS.find(p=>p.id==id);
let cart=JSON.parse(localStorage.getItem('neulbom_cart')||'[]');
const save=()=>{localStorage.setItem('neulbom_cart',JSON.stringify(cart));$('#cnt').textContent=cart.length};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}

const EN={harajuku:'HARAJUKU',gangnam:'GANGNAM',milano:'BRERA',kyoto:'GION',waitan:'THE BUND'};
function home(){const all=ROOMS.flatMap(r=>r.plants.map(p=>[p,r]));const minP=r=>Math.min(...r.plants.map(p=>p.price));
document.body.classList.add('home','over');
app.innerHTML=`<div class="slider bleed" id="sl">${ROOMS.map((r,i)=>`<div class="slide${i?'':' on'}"><img src="img/room_${r.id}.jpg" alt=""><div class="sl-cap"><div class="city">${r.city}</div><h2>${r.name.split(' · ')[0]}</h2><p>${r.name.split(' · ')[1]||''} — ${r.desc}</p><div class="btns"><a class="a1" href="#/room/${r.id}">자세히 보기</a><a class="a2" href="#/room/${r.id}">식물 고르기</a></div></div></div>`).join('')}
<div class="thumbs">${ROOMS.map((r,i)=>`<button aria-label="${r.name}"><img src="img/room_${r.id}.jpg" alt=""><svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="29"/><circle class="fg" cx="31" cy="31" r="29"/></svg></button>`).join('')}</div>
<button class="sl-nav p" aria-label="prev">←</button><button class="sl-nav n" aria-label="next">→</button></div>
<div class="intro"><hr><h1>당신의 방에도,<br>늘 봄이 머물도록.</h1><p>마음에 드는 방을 골라 주세요. 방 안의 식물을 누르면 바로 고를 수 있어요.</p></div>
<div class="sec2"><div class="en">LINEUP</div><h3>방 둘러보기</h3></div>
<div class="lineup">${ROOMS.map(r=>`<a class="lcard" href="#/room/${r.id}"><div class="ph"><img src="img/room_${r.id}.jpg" alt=""><div class="big">${EN[r.id]||r.city}</div>${r.id=='waitan'?'<span class="new">NEW</span>':''}</div><div class="area">${r.city}</div><h4>${r.desc}</h4><div class="pr">${w(minP(r))}~</div></a>`).join('')}</div>
<div class="sec2"><div class="en">PLANTS</div><h3>이 계절의 식물</h3></div>
<div class="sec" style="justify-content:flex-end;margin-top:-20px"><div class="arw" data-t="tr2"><button data-d="-1">←</button><button data-d="1">→</button></div></div>
<div class="track" id="tr2">${all.map(([p,r])=>`<a class="pcard" href="#/plant/${p.id}"><div class="ph"><img src="img/${p.id}.jpg" alt=""></div><h4>${p.name}</h4><p>${w(p.price)} · ${r.name.split(' · ')[0]}</p></a>`).join('')}</div>
<div class="dark bleed"><div class="sec2"><div class="en">HOW IT WORKS</div><h3>늘봄을 고르는 방법</h3></div><div class="steps">
<div class="step"><div class="n">01</div><img class="ic" src="img/room_gangnam.jpg" alt=""><b>방을 고르고</b><p>마음에 드는 방의 분위기에서<br>시작해요.</p></div>
<div class="step"><div class="n">02</div><img class="ic" src="img/g2.jpg" alt=""><b>식물을 누르고</b><p>방 안의 ● 을 누르면<br>그 식물을 바로 고를 수 있어요.</p></div>
<div class="step"><div class="n">03</div><img class="ic" src="img/pot_3.jpg" alt=""><b>화분을 맞추고</b><p>백자 · 테라코타 · 옹기,<br>흙과 영양제도 함께.</p></div>
<div class="step"><div class="n">04</div><img class="ic" src="img/k1.jpg" alt=""><b>심어서 보내 드려요</b><p>제휴 농원에서 바로 심어<br>3~5일 안에 도착해요.</p></div>
</div></div>
<div class="band bleed"><img src="img/room_milano.jpg" alt=""><div><h3>오늘, 당신의 방에<br>작은 봄 하나.</h3><a href="#/room/harajuku">방 고르러 가기</a></div></div>`;
const sl=$('#sl');sl.style.marginTop=-($('header').offsetHeight+parseFloat(getComputedStyle(app).paddingTop))+'px';
slider();tracks()}
addEventListener('scroll',()=>{if(document.body.classList.contains('home'))document.body.classList.toggle('over',scrollY<innerHeight*.75)},{passive:true});

let slT=null;
function slider(){const el=$('#sl');if(!el)return;const S=[...el.querySelectorAll('.slide')],B=[...el.querySelectorAll('.thumbs button')],DUR=6000;let i=0;
el.style.setProperty('--dur',DUR+'ms');
const go=n=>{i=(n+S.length)%S.length;S.forEach((s,k)=>s.classList.toggle('on',k==i));B.forEach(b=>b.classList.remove('on'));void el.offsetWidth;B[i].classList.add('on');clearTimeout(slT);slT=setTimeout(()=>{if(document.body.contains(el))go(i+1)},DUR)};
el.querySelector('.p').onclick=()=>go(i-1);el.querySelector('.n').onclick=()=>go(i+1);
B.forEach((b,k)=>b.onclick=()=>go(k));
let x0=null,moved=false;
el.addEventListener('pointerdown',e=>{x0=e.clientX;moved=false});
el.addEventListener('pointerup',e=>{if(x0==null)return;const d=e.clientX-x0;x0=null;if(Math.abs(d)>40){moved=true;go(i+(d<0?1:-1))}});
el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
go(0)}

function tracks(){document.querySelectorAll('.arw').forEach(a=>{const t=$('#'+a.dataset.t);a.querySelectorAll('button').forEach(b=>b.onclick=()=>t.scrollBy({left:+b.dataset.d*t.clientWidth*.8}))});
document.querySelectorAll('.track').forEach(t=>{let x=null,sl=0,mv=0;
 t.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;x=e.clientX;sl=t.scrollLeft;mv=0});
 t.addEventListener('pointermove',e=>{if(x==null)return;mv=e.clientX-x;if(Math.abs(mv)>4)t.classList.add('drag');t.scrollLeft=sl-mv});
 const up=()=>{if(x==null)return;x=null;t.classList.remove('drag')};
 t.addEventListener('pointerup',up);t.addEventListener('pointerleave',up);
 t.addEventListener('click',e=>{if(Math.abs(mv)>6){e.preventDefault();mv=0}},true)})}

function room(id){const r=ROOMS.find(x=>x.id==id);if(!r)return home();
app.innerHTML=`<div class="crumb"><a href="#/">방 고르기</a> · ${r.name}</div>
<div class="ttl"><div class="city">${r.city}</div><h2>${r.name}</h2><p>방 안의 <span style="color:var(--leaf)">●</span> 을 눌러 식물을 골라 보세요</p></div>
<div class="scene" id="scene"><img src="img/room_${r.id}.jpg">${r.plants.map(p=>`<button class="hs" style="left:${p.x}%;top:${p.y}%" data-id="${p.id}" aria-label="${p.name}"></button>`).join('')}</div>
<div class="gap" style="height:40px"></div>
<div class="sec"><h3><span class="en">IN THIS ROOM</span>이 방의 식물 ${r.plants.length}가지</h3><div class="arw" data-t="tr3"><button data-d="-1">←</button><button data-d="1">→</button></div></div>
<div class="track" id="tr3">${r.plants.map(p=>`<a class="pcard" href="#/plant/${p.id}"><div class="ph"><img src="img/${p.id}.jpg" alt=""></div><h4>${p.name}</h4><p>${w(p.price)} · <span class="tag">${p.cat}</span></p></a>`).join('')}</div>
<a class="back" href="#/">← 다른 방 보기</a>`;
tracks();
const sc=$('#scene');
sc.querySelectorAll('.hs').forEach(b=>b.onclick=e=>{e.stopPropagation();sc.querySelectorAll('.hs').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 const [p]=plantById(b.dataset.id);sc.querySelector('.tip')?.remove();
 const t=document.createElement('a');t.className='tip';t.href='#/plant/'+p.id;
 t.innerHTML=`<img src="img/${p.id}.jpg"><div><b>${p.name}</b><span>${w(p.price)} · ${p.cat}</span><br><span class="go">이 식물 고르기 →</span></div>`;
 sc.appendChild(t);const W=sc.clientWidth,H=sc.clientHeight,tw=t.offsetWidth,th=t.offsetHeight;
 let L=p.x/100*W-tw/2,T=p.y/100*H+22;L=Math.max(8,Math.min(W-tw-8,L));if(T+th>H-8)T=p.y/100*H-th-22;T=Math.max(8,T);
 t.style.left=L+'px';t.style.top=T+'px'});
sc.onclick=()=>{sc.querySelector('.tip')?.remove();sc.querySelectorAll('.hs').forEach(x=>x.classList.remove('on'))}}

function plant(id){const [p,r]=plantById(id)||[];if(!p)return home();
app.innerHTML=`<div class="crumb"><a href="#/">방 고르기</a> · <a href="#/room/${r.id}">${r.name}</a> · ${p.name}</div>
<div class="detail"><img src="img/${p.id}.jpg"><div><span class="tag">${p.cat}</span><h2>${p.name}</h2><div class="price">${w(p.price)}</div><p>${p.txt}</p>
<dl><div><span>어울리는 방</span><span>${r.name}</span></div><div><span>햇빛</span><span>${p.light}</span></div><div><span>배송</span><span>제휴 농원에서 심어 3~5일</span></div></dl>
<a class="btn" href="#/pot/${p.id}">화분 고르기 →</a></div></div>
<a class="back" href="#/room/${r.id}">← 방으로 돌아가기</a>`}

function pot(id){const [p,r]=plantById(id)||[];if(!p)return home();
const list=r.pots.map(potById);
app.innerHTML=`<div class="crumb"><a href="#/room/${r.id}">${r.name}</a> · <a href="#/plant/${p.id}">${p.name}</a> · 화분</div>
<div class="ttl"><h2>화분을 골라 주세요</h2><p>${p.name}이(가) 오래 머무를 집</p></div>
<div class="grid3">${list.map((o,i)=>`<a class="item" href="#/opt/${p.id}/${o.id}"><img src="img/${o.id}.jpg"><h4>${o.name}</h4><p>${o.txt}<br>+${w(o.price)}${i==0?`<br><span class="tag">이 방에 추천</span>`:''}</p></a>`).join('')}</div>
<a class="back" href="#/plant/${p.id}">← 식물로 돌아가기</a>`}

function opt(id,pid){const [p,r]=plantById(id)||[];const o=potById(pid);if(!p||!o)return home();
const S={soil:0,ex:[false,false]};
app.innerHTML=`<div class="crumb"><a href="#/room/${r.id}">${r.name}</a> · ${p.name} · ${o.name}</div>
<div class="ttl"><h2>마무리</h2><p>흙과 영양제는 원하실 때만</p></div>
<div class="opt">${SOIL.map((s,i)=>`<div class="row ${i==0?'sel':''}" data-soil="${i}"><div class="l"><b>${s[0]}</b><p>${s[2]}</p></div><div class="r">${s[1]?'+'+w(s[1]):'포함'}<span class="dot"></span></div></div>`).join('')}
${EXTRA.map((s,i)=>`<div class="row" data-ex="${i}"><div class="l"><b>${s[0]}</b><p>${s[2]}</p></div><div class="r">+${w(s[1])}<span class="dot"></span></div></div>`).join('')}</div>
<div class="sum" id="sum"></div><p class="note">주문이 들어오면 제휴 농원에서 바로 심어 보내 드립니다 · 3~5일</p>
<button class="btn" id="add">장바구니에 담기</button><a class="back" href="#/pot/${p.id}">← 화분 다시 고르기</a>`;
const lines=()=>[[p.name,p.price],[o.name+' 화분',o.price],[SOIL[S.soil][0],SOIL[S.soil][1]],...EXTRA.filter((_,i)=>S.ex[i]).map(e=>[e[0],e[1]])];
const draw=()=>{const L=lines(),t=L.reduce((a,b)=>a+b[1],0);$('#sum').innerHTML=L.map(x=>`<div class="line"><span>${x[0]}</span><span>${x[1]?w(x[1]):'포함'}</span></div>`).join('')+`<div class="line tot"><span>합계</span><span>${w(t)}</span></div>`};
app.querySelectorAll('[data-soil]').forEach(e=>e.onclick=()=>{app.querySelectorAll('[data-soil]').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');S.soil=+e.dataset.soil;draw()});
app.querySelectorAll('[data-ex]').forEach(e=>e.onclick=()=>{e.classList.toggle('sel');S.ex[+e.dataset.ex]=e.classList.contains('sel');draw()});
$('#add').onclick=()=>{const L=lines();cart.push({plant:p.id,room:r.name,title:`${p.name} × ${o.name}`,lines:L,total:L.reduce((a,b)=>a+b[1],0)});save();toast('장바구니에 담았어요');location.hash='#/cart'};
draw()}

function cartPage(){if(!cart.length){app.innerHTML=`<div class="ttl"><h2>장바구니</h2></div><p class="empty">아직 비어 있어요.</p><a class="btn ghost" href="#/">방 보러 가기</a>`;return}
const t=cart.reduce((a,b)=>a+b.total,0),ship=t>=50000?0:4000;
app.innerHTML=`<div class="ttl"><h2>장바구니</h2><p>${cart.length}개의 화분</p></div><div class="opt">
${cart.map((c,i)=>`<div class="cartrow"><img src="img/${c.plant}.jpg"><div class="m"><b>${c.title}</b>${c.lines.slice(2).map(l=>l[0]).join(' · ')}<br>${c.room}</div><div>${w(c.total)}<br><button class="x" data-i="${i}">삭제</button></div></div>`).join('')}</div>
<div class="sum"><div class="line"><span>상품</span><span>${w(t)}</span></div><div class="line"><span>배송비</span><span>${ship?w(ship):'무료'}</span></div><div class="line tot"><span>합계</span><span>${w(t+ship)}</span></div></div>
<p class="note">₩50,000 이상 무료 배송</p><a class="btn" href="#/checkout">주문하기</a><a class="back" href="#/">← 쇼핑 계속하기</a>`;
app.querySelectorAll('.x').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);save();cartPage()})}

function checkout(){if(!cart.length)return cartPage();
app.innerHTML=`<div class="ttl"><h2>주문 정보</h2><p>데모 사이트예요. 실제 결제는 되지 않아요.</p></div>
<form class="f" id="f"><label>받는 분</label><input required placeholder="홍길동"><label>연락처</label><input required placeholder="010-0000-0000"><label>주소</label><input required placeholder="서울시 …"><label>배송 메모</label><textarea rows="2" placeholder="문 앞에 놓아 주세요"></textarea>
<button class="btn" type="submit">결제하기 (데모)</button></form><a class="back" href="#/cart">← 장바구니로</a>`;
$('#f').onsubmit=e=>{e.preventDefault();cart=[];save();location.hash='#/done/'+Math.floor(100000+Math.random()*900000)}}

function done(no){app.innerHTML=`<div class="hero"><h1>고맙습니다.</h1><p>주문번호 NB-${no}<br>제휴 농원에서 정성껏 심어 3~5일 안에 보내 드릴게요.</p></div><a class="btn ghost" href="#/">처음으로</a>`}

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');scrollTo(0,0);document.body.classList.remove('home','over');
({room:()=>room(h[1]),plant:()=>plant(h[1]),pot:()=>pot(h[1]),opt:()=>opt(h[1],h[2]),cart:cartPage,checkout,done:()=>done(h[1])}[h[0]]||home)();
app.style.animation='none';app.offsetHeight;app.style.animation=''}
addEventListener('hashchange',route);save();route();
</script>

</body>
</html>
